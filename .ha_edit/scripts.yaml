heizung_eco_all:
  alias: Heizung – Alles ECO
  sequence:
  - service: climate.set_temperature
    target:
      entity_id:
      - climate.schlafzimmer
      - climate.gang
      - climate.bad
    data:
      temperature: '{{ states(''input_number.eco_temp_global'') | float(17) }}'
  - service: climate.set_hvac_mode
    target:
      entity_id:
      - climate.schlafzimmer
      - climate.gang
      - climate.bad
    data:
      hvac_mode: heat
  mode: single
  icon: mdi:leaf
heizung_nachtmodus:
  alias: Heizung – Nachtmodus
  sequence:
  - service: climate.set_temperature
    target:
      entity_id: climate.schlafzimmer
    data:
      temperature: '{{ states(''input_number.schlafzimmer_nacht_temp'') | float(20)
        }}'
  - service: climate.set_hvac_mode
    target:
      entity_id: climate.schlafzimmer
    data:
      hvac_mode: heat
  mode: single
  icon: mdi:weather-night
lokalen_llm_fragen_und_antwort_sprechen:
  alias: Lokalen LLM fragen und Antwort sprechen
  mode: single
  fields:
    frage:
      name: Frage
      description: Text, der an den lokalen LLM gesendet wird
      required: true
      selector:
        text:
    ziel_player:
      name: Ziel-Lautsprecher
      description: Echo Base oder SAT1 auswählen
      required: true
      default: echo_base
      selector:
        select:
          options:
          - label: Echo Base
            value: echo_base
          - label: SAT1
            value: sat1
  sequence:
  - variables:
      media_player: "{% if ziel_player == 'sat1' %}\n  media_player.satellite1_c412d0_sat1_media_player\n{%
        else %}\n  media_player.atoms3r_voice_echo_base_player\n{% endif %}\n"
  - action: conversation.process
    data:
      text: '{{ frage }}'
      language: de
    response_variable: llm_antwort
  - action: tts.speak
    target:
      entity_id: tts.piper
    data:
      media_player_entity_id: '{{ media_player | trim }}'
      message: '{{ llm_antwort.response.speech.plain.speech }}'
  description: ''

llm_fragen_und_sprechen:
  alias: LLM fragen und sprechen
  description: Fragt den lokalen LLM-Agenten und spricht die Antwort per Piper.
  mode: single
  fields:
    frage:
      name: Frage
      description: Text für den lokalen LLM.
      required: true
      selector:
        text:
    ziel_player:
      name: Ziel-Lautsprecher
      description: Ausgabeziel für die Antwort.
      required: true
      default: echo_base
      selector:
        select:
          options:
          - label: Echo Base
            value: echo_base
          - label: SAT1
            value: sat1
          - label: Alle
            value: all
  sequence:
  - action: conversation.process
    data:
      agent_id: conversation.locales_llm_ai_agent
      text: '{{ frage }}'
      language: de
    response_variable: llm_antwort
  - variables:
      antwort_text: "{% if llm_antwort is defined and llm_antwort.response is defined\n  and llm_antwort.response.speech is defined and llm_antwort.response.speech.plain is defined\n  and llm_antwort.response.speech.plain.speech is defined\n%}\n  {{ llm_antwort.response.speech.plain.speech }}\n{% else %}\n  Ich konnte gerade keine Antwort erzeugen.\n{% endif %}\n"
  - action: script.tts_ansage
    data:
      nachricht: '{{ antwort_text | trim }}'
      ziel_player: '{{ ziel_player }}'

tts_ansage:
  alias: TTS Ansage
  description: Spricht eine Nachricht per Piper auf ausgewählten Ziel-Playern.
  mode: queued
  max: 20
  fields:
    nachricht:
      name: Nachricht
      description: Zu sprechender Text.
      required: true
      selector:
        text:
    ziel_player:
      name: Ziel-Lautsprecher
      description: Ausgabeziel für die Ansage.
      required: true
      default: echo_base
      selector:
        select:
          options:
          - label: Echo Base
            value: echo_base
          - label: SAT1
            value: sat1
          - label: Alle
            value: all
    piper_stimme:
      name: Piper Stimme
      description: Optionale Piper-Stimme, z. B. de_DE-ramona-low.
      required: false
      selector:
        text:
    piper_tts_entity:
      name: Piper TTS Entity
      description: Optionale TTS-Entity, z. B. tts.piper_fast.
      required: false
      selector:
        text:
  variables:
    player_echo_base: media_player.atoms3r_voice_echo_base_player
    player_sat1: media_player.satellite1_c412d0_sat1_media_player
    piper_voice_trim: "{{ piper_stimme | default('') | trim }}"
    has_piper_voice: "{{ piper_voice_trim != '' }}"
    selected_tts_entity: "{{ piper_tts_entity | default('tts.piper', true) | trim }}"
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ziel_player == ''echo_base'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ states(player_echo_base) not in [''unavailable'', ''unknown''] }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ has_piper_voice }}'
              sequence:
              - action: tts.speak
                target:
                  entity_id: '{{ selected_tts_entity }}'
                data:
                  media_player_entity_id: '{{ player_echo_base }}'
                  message: '{{ nachricht }}'
                  options:
                    voice: '{{ piper_voice_trim }}'
            default:
            - action: tts.speak
              target:
                entity_id: '{{ selected_tts_entity }}'
              data:
                media_player_entity_id: '{{ player_echo_base }}'
                message: '{{ nachricht }}'
        default:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ states(player_sat1) not in [''unavailable'', ''unknown''] }}'
            sequence:
            - action: system_log.write
              data:
                level: warning
                message: 'Echo Base nicht verfügbar, fallback auf SAT1.'
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ has_piper_voice }}'
                sequence:
                - action: tts.speak
                  target:
                    entity_id: '{{ selected_tts_entity }}'
                  data:
                    media_player_entity_id: '{{ player_sat1 }}'
                    message: '{{ nachricht }}'
                    options:
                      voice: '{{ piper_voice_trim }}'
              default:
              - action: tts.speak
                target:
                  entity_id: '{{ selected_tts_entity }}'
                data:
                  media_player_entity_id: '{{ player_sat1 }}'
                  message: '{{ nachricht }}'
          default:
          - action: system_log.write
            data:
              level: warning
              message: 'TTS übersprungen: Echo Base nicht verfügbar.'
    - conditions:
      - condition: template
        value_template: '{{ ziel_player == ''sat1'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ states(player_sat1) not in [''unavailable'', ''unknown''] }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ has_piper_voice }}'
              sequence:
              - action: tts.speak
                target:
                  entity_id: '{{ selected_tts_entity }}'
                data:
                  media_player_entity_id: '{{ player_sat1 }}'
                  message: '{{ nachricht }}'
                  options:
                    voice: '{{ piper_voice_trim }}'
            default:
            - action: tts.speak
              target:
                entity_id: '{{ selected_tts_entity }}'
              data:
                media_player_entity_id: '{{ player_sat1 }}'
                message: '{{ nachricht }}'
        default:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ states(player_echo_base) not in [''unavailable'', ''unknown''] }}'
            sequence:
            - action: system_log.write
              data:
                level: warning
                message: 'SAT1 nicht verfügbar, fallback auf Echo Base.'
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ has_piper_voice }}'
                sequence:
                - action: tts.speak
                  target:
                    entity_id: '{{ selected_tts_entity }}'
                  data:
                    media_player_entity_id: '{{ player_echo_base }}'
                    message: '{{ nachricht }}'
                    options:
                      voice: '{{ piper_voice_trim }}'
              default:
              - action: tts.speak
                target:
                  entity_id: '{{ selected_tts_entity }}'
                data:
                  media_player_entity_id: '{{ player_echo_base }}'
                  message: '{{ nachricht }}'
          default:
          - action: system_log.write
            data:
              level: warning
              message: 'TTS übersprungen: SAT1 nicht verfügbar.'
    - conditions:
      - condition: template
        value_template: '{{ ziel_player == ''all'' }}'
      sequence:
      - variables:
          all_targets: "{% set ns = namespace(ids=[]) %}\n{% if states(player_echo_base) not in ['unavailable', 'unknown'] %}\n  {% set ns.ids = ns.ids + [player_echo_base] %}\n{% endif %}\n{% if states(player_sat1) not in ['unavailable', 'unknown'] %}\n  {% set ns.ids = ns.ids + [player_sat1] %}\n{% endif %}\n{{ ns.ids }}\n"
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ all_targets | count > 0 }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ has_piper_voice }}'
              sequence:
              - action: tts.speak
                target:
                  entity_id: '{{ selected_tts_entity }}'
                data:
                  media_player_entity_id: '{{ all_targets }}'
                  message: '{{ nachricht }}'
                  options:
                    voice: '{{ piper_voice_trim }}'
            default:
            - action: tts.speak
              target:
                entity_id: '{{ selected_tts_entity }}'
              data:
                media_player_entity_id: '{{ all_targets }}'
                message: '{{ nachricht }}'
        default:
        - action: system_log.write
          data:
            level: warning
            message: 'TTS (all) übersprungen: kein verfügbarer Player.'
    default:
    - action: system_log.write
      data:
        level: warning
        message: 'TTS übersprungen: unbekannter ziel_player={{ ziel_player }}.'
