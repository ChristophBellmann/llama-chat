kueche_set_temperature:
  alias: Küche – Setze Solltemperatur
  sequence:
  - service: climate.set_temperature
    data:
      temperature: '{{ temperature }}'
      entity_id:
      - climate.kitchen_left
      - climate.kitchen_right
kueche_set_hvac_mode:
  alias: Küche – Setze Modus
