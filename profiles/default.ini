version = 1

# ---------------------------------------------------------------------------
# Gemeinsame Einstellungen.
#
# ACHTUNG (ab llama.cpp b10741): host/port werden aus der ini NICHT mehr
# uebernommen -- der Router bindet sonst auf 127.0.0.1:8080. Die Werte muessen
# per CLI kommen; run_profile.sh uebergibt sie deshalb explizit.
# Die beiden Zeilen hier bleiben nur als Dokumentation stehen.
#host = 0.0.0.0
#port = 8080
#
# Thinking: alle drei Modelle unten haben enable_thinking im Chat-Template.
# --reasoning-budget 0 ist bei den qwen35-Modellen WIRKUNGSLOS (getestet auf
# b10741: 5,2 s und leerer content, weil das Token-Budget im Denken aufgeht).
# Der einzige Schalter, der greift, ist chat-template-kwargs:
# ---------------------------------------------------------------------------
[*]
jinja = true
flash-attn = on
ngl = 999
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0
ctx-size = 8192
batch-size = 2048
ubatch-size = 512
chat-template-kwargs = {"enable_thinking":false}

[locales_llm]
alias = locales_llm

# === AKTIV: gemma-4-12B-it-qat-UD-Q4_K_XL =================================
# 6,24 GiB | 838 t/s pp512 | 39,5 t/s tg128 | 8,18 GiB VRAM belegt
# Beim Prompt-Processing gleichauf mit Qwen3.5-9B, beim Generieren ~20 %
# langsamer, formuliert dafuer natuerlicheres Deutsch. ~3,8 GiB Reserve.
# Braucht keine Extra-Settings -- die Werte aus [*] passen unveraendert.
model = /media/christoph/some_space/Compute/ML-Lab/llama-chat/models/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf

# === Alternative: Qwen3.5-9B-Q4_K_M =======================================
# 5,28 GiB | 849 t/s pp512 | 50,2 t/s tg128 | 6,52 GiB VRAM belegt
# Schnellstes Modell im Textchat-Test (0,38 s vs. 0,41 s kurze Antwort,
# 1,64 s vs. 1,95 s bei ~70 Tokens) und mit ~5,5 GiB die groesste Reserve.
#model = /media/christoph/some_space/Compute/ML-Lab/llama-chat/models/Qwen3.5-9B-Q4_K_M.gguf

# === Alternative: Dirk-Qwen3.8-27B-UD-IQ3_XXS =============================
# 10,17 GiB | 287 t/s pp512 | 18,7 t/s tg128 | 11,49 GiB VRAM belegt (96 %!)
# Braucht zwingend llama.cpp >= b10741 (davor: "missing tensor
# blk.64.ssm_conv1d.weight", der MTP-Layer wurde nicht erkannt).
# Laeuft, aber ohne jede VRAM-Reserve: parallel > 1 oder ctx > 8192 kippt in
# OOM, und jede Spitze des Desktops kann den Server mitreissen.
# Bei Verwendung zusaetzlich ctx-size klein halten:
#model = /media/christoph/some_space/Compute/ML-Lab/llama-chat/models/Dirk-Qwen3.8-27B-UD-IQ3_XXS.gguf
#ctx-size = 8192
#batch-size = 512
#ubatch-size = 256

# === Alternative: gemma-4-E4B-it-ultra-uncensored-heretic-Q8_0 ============
#model = /media/christoph/some_space/Compute/ML-Lab/llama-chat/models/gemma-4-E4B-it-ultra-uncensored-heretic-Q8_0.gguf
