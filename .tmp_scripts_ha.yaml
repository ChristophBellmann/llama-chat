heizung_eco_all:
  alias: Heizung – Alles ECO
  sequence:
  - service: climate.set_temperature
    target:
      entity_id:
      - climate.schlafzimmer
      - climate.gang
      - climate.bad
    data:
      temperature: '{{ states(''input_number.eco_temp_global'') | float(17) }}'
  - service: climate.set_hvac_mode
    target:
      entity_id:
      - climate.schlafzimmer
      - climate.gang
      - climate.bad
    data:
      hvac_mode: heat
  mode: single
  icon: mdi:leaf
heizung_nachtmodus:
  alias: Heizung – Nachtmodus
  sequence:
