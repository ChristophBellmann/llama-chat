# Der bestehende Router verwahrt den Schlüssel und weckt nur bei Modellauswahl.
rest:
  - resource: http://127.0.0.1:11436/workstation/models
    scan_interval: 10
    timeout: 12
    sensor:
      - name: Workstation Modellstatus
        unique_id: workstation_modellstatus
        value_template: "{{ value_json.status }}"
        json_attributes:
          - models
          - active
          - ready
          - requested
          - error
          - voice

rest_command:
  workstation_modell_laden:
    url: http://127.0.0.1:11436/workstation/models
    method: POST
    content_type: application/json
    payload: '{{ {"model": modell} | to_json }}'
    timeout: 60

template:
  - select:
      - name: Workstation Modell
        unique_id: workstation_modell
        icon: mdi:brain
        availability: "{{ (state_attr('sensor.workstation_modellstatus', 'models') or []) | length > 0 and states('sensor.workstation_modellvergleich') not in ['läuft', 'stellt wieder her'] }}"
        state: "{{ state_attr('sensor.workstation_modellstatus', 'active') or 'unknown' }}"
        options: "{{ state_attr('sensor.workstation_modellstatus', 'models') or [] }}"
        select_option:
          - action: rest_command.workstation_modell_laden
            data:
              modell: "{{ option }}"
            response_variable: ergebnis
          - if: "{{ ergebnis.status in [200, 202] and option == 'Qwen3.8-27B-UD-IQ2_S.gguf' }}"
            then:
              - action: shell_command.set_voice_tts
                data:
                  stimme: Ramona (Piper, lokal)
                response_variable: stimmergebnis
              - if: "{{ stimmergebnis.returncode != 0 }}"
                then:
                  - action: persistent_notification.create
                    data:
                      title: Ramona nicht aktiviert
                      message: "{{ stimmergebnis.stderr }}"
          - if: "{{ ergebnis.status not in [200, 202] }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: workstation_modell_fehler
                  title: Workstation-Modell nicht gewechselt
                  message: "{{ ergebnis.content }}"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.workstation_modellstatus
  - sensor:
      - name: Workstation geladenes Modell
        unique_id: workstation_geladenes_modell
        icon: mdi:brain
        state: "{{ state_attr('sensor.workstation_modellstatus', 'active') or 'unbekannt' }}"
      - name: Workstation Modellstimme
        unique_id: workstation_modellstimme
        icon: mdi:account-voice
        state: >-
          {% set wunsch = states('input_select.voice_tts') %}
          {{ 'Ramona (Piper, lokal)'
             if state_attr('sensor.workstation_modellstatus', 'voice') == 'ramona'
             or (wunsch == 'Jana (Orpheus, Workstation)' and
                 not is_state('binary_sensor.orpheus_tts_erreichbar', 'on'))
             else wunsch }}

automation:
  - id: workstation_modell_ladefehler
    alias: Workstation-Modell Ladefehler melden
    triggers:
      - trigger: state
        entity_id: sensor.workstation_modellstatus
        to: Fehler
    actions:
      - action: persistent_notification.create
        data:
          notification_id: workstation_modell_fehler
          title: Workstation-Modell Ladefehler
          message: "{{ state_attr('sensor.workstation_modellstatus', 'error') }}"
